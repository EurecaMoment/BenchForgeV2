      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: both
      - id: persistent-shell
        name: cordis:group
        group: true
        isolate:
          terminals: true
        config:
        - id: pty
          name: '@deepseek-ai/dsh-terminal'
        - id: terminal-bash
          name: '@deepseek-ai/dsh-terminal-bash'
          disabled: !!js 'process.platform === ''win32'''
          config:
            timeoutMs: 300000
        - id: persistent-bash
          name: '@eurecamoment/benchforge-dsh/persistent-shell'
          disabled: !!js 'process.platform === ''win32'''
          config:
            timeoutMs: 300000
            description: 'Run commands in a bash shell

              * When invoking this tool, the contents of the "command" parameter does
              NOT need to be XML-escaped.

              * Network access depends on the task environment. Prefer configured
              mirrors/proxies when they are available.

              * State is persistent across command calls and discussions with the
              user.

              * To inspect a particular line range of a file, e.g. lines 10-25, try
              ''sed -n 10,25p /path/to/the/file''.

              * Please avoid commands that may produce a very large amount of output.

              * Please run long lived commands in the background, e.g. ''sleep 10
              &'' or start a server in the background.'
            shell: bash
        - id: terminal-pwsh
          name: '@deepseek-ai/dsh-terminal-bash'
          disabled: !!js 'process.platform !== ''win32'''
          config:
            shellDialect: pwsh
            timeoutMs: 300000
        - id: persistent-pwsh
          name: '@eurecamoment/benchforge-dsh/persistent-shell'
          disabled: !!js 'process.platform !== ''win32'''
          config:
            timeoutMs: 300000
            description: 'Run commands in a PowerShell shell

              * When invoking this tool, the contents of the "command" parameter does
              NOT need to be XML-escaped.

              * You don''t have access to the internet via this tool.

              * State is persistent across command calls and discussions with the
              user.

              * Use native Windows paths (C:\...) and $env:NAME variables; this is
              PowerShell, not bash.

              * Please avoid commands that may produce a very large amount of output.

              * Please run long lived commands in the background, e.g. ''Start-Job''
              or start a server with Start-Process.'
            shell: pwsh
