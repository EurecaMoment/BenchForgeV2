[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge-backend"
version = "0.3.0"
description = "DSH controlled embodied scene and dataset production"
requires-python = ">=3.11,<3.14"
dependencies = ["sqlalchemy>=2", "psycopg[binary]", "Pillow", "numpy", "trimesh>=4", "pycocotools>=2.0.10", "grpcio>=1.85.1", "protobuf>=7.35.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchforge_backend*"]
namespaces = false

[tool.setuptools.package-data]
benchforge_backend = ["native_assets.json", "native_materials.json", "material_previews/*.jpg"]
"benchforge_backend.isaac" = ["isaac_sim.proto"]
