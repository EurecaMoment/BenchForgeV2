name: core
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/package-lock.json
      - run: npm ci --prefix integrations
      - run: npm run build:benchforge-ui --prefix integrations
      - run: git diff --exit-code -- integrations/benchforge/ui/client.js
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pip install ruff==0.11.13
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m ruff check src/benchforge_core components/benchforge/src/benchforge_backend integrations/benchforge
      - run: python -m pip install ".[production,research]"
      - run: python -m unittest discover -s tests -v
      - name: Check the README editable installation
        run: python -m pip install --no-deps -e .
      - run: python integrations/benchforge/smoke.py
      - run: node --test integrations/benchforge/tests/test_workbench.mjs integrations/benchforge/tests/test_assessment_plan.mjs integrations/benchforge/tests/test_workbench_request.mjs integrations/benchforge/tests/test_workbench_feedback.mjs
      - run: node --test integrations/benchforge/tests/test_request_identity.mjs
      - run: node --test integrations/benchforge/tests/test_parallel_sessions.mjs integrations/benchforge/tests/test_synthesis_sessions.mjs integrations/benchforge/tests/test_synthesis_scope.mjs integrations/benchforge/tests/test_preparation_tool.mjs integrations/benchforge/tests/test_preparation_products.mjs integrations/benchforge/tests/test_plugin_contracts.mjs integrations/benchforge/tests/test_delivery_review.mjs
      - if: matrix.python == '3.12'
        run: python -m pip install -e components/benchforge
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s integrations/benchforge/tests -p test_production_observer.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -t . -p test_deployment_config.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_configured_operations.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_inference_service.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_service_errors.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_capture_scope.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_scene_preflight.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_scene_acceptance.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_native_round_support.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_desktop_lifecycle.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_queue_recovery.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_model_json_recovery.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s integrations/benchforge/tests -p test_repair_baseline.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_force_contacts.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_capture_transfer.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_spatialtree_recording_contract.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -p test_camera_trajectory.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -t . -p test_mesh_import_installation.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/desktop -t . -p test_worker.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/desktop -t . -p test_resident.py -v
      - if: matrix.python == '3.12'
        run: python -m pip install opencv-python-headless
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/desktop -t . -p test_interaction_recording.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/desktop -t . -p test_spatialtree_trajectory.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/tests -t . -p test_robot_contact.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/benchforge/desktop -t . -p test_capture_images.py -v
