name: core
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ".[production,research]"
      - run: python -m unittest discover -s tests -v
      - run: python quickstart.py --workspace runs/ci-demo
      - run: python examples/production_demo.py --workspace runs/ci-production
      - run: python integrations/spatialforge/smoke.py
