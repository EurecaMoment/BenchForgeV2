name: core
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/package-lock.json
      - run: npm ci --prefix integrations
      - run: npm run build:spatialforge-ui --prefix integrations
      - run: git diff --exit-code -- integrations/spatialforge/ui/client.js
      - run: python scripts/check_repository_hygiene.py
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pip install ruff==0.11.13
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m ruff check src/benchforge_core components/benchclaw/src/benchclaw components/spatialforge/src/spatialforge integrations/spatialforge
      - run: python -m pip install ".[production,research]"
      - run: python -m unittest discover -s tests -v
      - name: Check the README editable installation
        run: python -m pip install --no-deps -e .
      - run: python quickstart.py --workspace runs/ci-demo
      - run: python examples/production_demo.py --workspace runs/ci-production
      - run: python integrations/spatialforge/smoke.py
      - run: python -m unittest discover -s integrations/tests -v
      - run: node --test integrations/tests/preset_catalog.test.mjs
      - run: node --test integrations/spatialforge/tests/test_workbench.mjs integrations/spatialforge/tests/test_assessment_plan.mjs integrations/spatialforge/tests/test_workbench_request.mjs integrations/spatialforge/tests/test_workbench_feedback.mjs
      - run: node --test integrations/spatialforge/tests/test_request_identity.mjs
      - run: node --test integrations/spatialforge/tests/test_parallel_sessions.mjs integrations/spatialforge/tests/test_synthesis_sessions.mjs integrations/spatialforge/tests/test_synthesis_scope.mjs integrations/spatialforge/tests/test_preparation_tool.mjs integrations/spatialforge/tests/test_preparation_products.mjs integrations/spatialforge/tests/test_plugin_contracts.mjs integrations/spatialforge/tests/test_delivery_review.mjs
      - if: matrix.python == '3.12'
        run: python -m pip install -e "components/benchclaw[postgres]" -e components/spatialforge
      - if: matrix.python == '3.12'
        run: python scripts/check_release_artifacts.py
      - if: matrix.python == '3.12'
        run: node integrations/tests/check_release_package.mjs
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s integrations/spatialforge/tests -p test_production_observer.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -t . -p test_deployment_config.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_configured_operations.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_inference_service.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_service_errors.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_capture_scope.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_scene_preflight.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_scene_acceptance.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_native_round_support.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_desktop_lifecycle.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_queue_recovery.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_model_json_recovery.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s integrations/spatialforge/tests -p test_repair_baseline.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_force_contacts.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_capture_transfer.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_spatialtree_recording_contract.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -p test_camera_trajectory.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -t . -p test_mesh_import_installation.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/desktop -t . -p test_worker.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/desktop -t . -p test_resident.py -v
      - if: matrix.python == '3.12'
        run: python -m pip install opencv-python-headless
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/desktop -t . -p test_interaction_recording.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/desktop -t . -p test_spatialtree_trajectory.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/tests -t . -p test_robot_contact.py -v
      - if: matrix.python == '3.12'
        run: python -m unittest discover -s components/spatialforge/desktop -t . -p test_capture_images.py -v
