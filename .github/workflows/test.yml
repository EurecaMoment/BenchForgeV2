name: Build and verify
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/dsh/package-lock.json
      - run: npm ci --prefix src/dsh
      - run: git diff --exit-code -- src/dsh/client/client.js
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m pip install ruff==0.11.13
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: python -m ruff check src
      - name: Install benchmark workflows
        run: python -m pip install -e ".[dsh,production,research]"
      - run: benchforge --help
      - if: matrix.python == '3.12'
        run: python -m server.http_api --help
