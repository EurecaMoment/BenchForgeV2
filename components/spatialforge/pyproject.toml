[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialforge"
version = "0.3.0"
description = "DSH controlled embodied scene and dataset production"
requires-python = ">=3.11,<3.14"
dependencies = ["sqlalchemy>=2", "psycopg[binary]", "Pillow", "numpy", "trimesh>=4", "benchclaw-harness==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spatialforge = ["native_assets.json", "native_materials.json", "material_previews/*.jpg"]
