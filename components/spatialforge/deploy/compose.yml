services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: spatialforge
      POSTGRES_DB: spatialforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python spatialforge_app.py init first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatialforge -d spatialforge"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  database:
