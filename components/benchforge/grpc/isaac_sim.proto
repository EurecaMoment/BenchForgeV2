syntax = "proto3";

package benchforge.isaac;

// Isaac Sim 远程仿真服务契约。
// 服务端运行在仿真器所在服务器（server.py），BenchForge 侧通过 client.py 调用；
// 本机 mock 服务与远程真实实现共用这份 proto，接口一致、内容可 mock。
service IsaacSim {
  // 连通性测试：服务端打印 info 并原样回显。
  rpc Test(TestRequest) returns (TestResponse);

  // 上传采集所需资产（客户端流式分块）：先按 job_id + name 上传，再调用 Capture。
  rpc UploadAsset(stream AssetChunk) returns (UploadAssetReply);

  // 提交采集作业（异步，立即返回）：request_json 即 worker 原本写盘的 request.json。
  rpc Capture(CaptureRequest) returns (CaptureReply);

  // 轮询作业状态：queued / running / completed / failed / cancelled。
  rpc JobStatus(JobStatusRequest) returns (JobStatusReply);

  // 取消作业。
  rpc Cancel(CancelRequest) returns (CancelReply);

  // 下载采集工件（服务端流式分块）：name 留空表示依次发送该作业的全部工件。
  rpc DownloadArtifacts(ArtifactRequest) returns (stream ArtifactChunk);
}

message TestRequest {
  string info = 1;
}

message TestResponse {
  bool ok = 1;
  string echo = 2;
}

// job_id 由客户端生成并保证唯一，Capture 之前用它归集资产。
message AssetChunk {
  string job_id = 1;
  string name = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}

message UploadAssetReply {
  string job_id = 1;
  string name = 2;
  uint64 bytes_received = 3;
}

message CaptureRequest {
  string job_id = 1;
  bytes request_json = 2;
}

message CaptureReply {
  string job_id = 1;
  bool accepted = 2;
  string message = 3;
}

enum JobState {
  JOB_UNKNOWN = 0;
  JOB_QUEUED = 1;
  JOB_RUNNING = 2;
  JOB_COMPLETED = 3;
  JOB_FAILED = 4;
  JOB_CANCELLED = 5;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusReply {
  JobState state = 1;
  string message = 2;
  // completed 时的工件相对路径列表。
  repeated string artifacts = 3;
}

message CancelRequest {
  string job_id = 1;
}

message CancelReply {
  bool cancelled = 1;
  string message = 2;
}

message ArtifactRequest {
  string job_id = 1;
  string name = 2;
}

message ArtifactChunk {
  string job_id = 1;
  string name = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool eof = 5;
}
