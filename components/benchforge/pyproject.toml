[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge-backend"
version = "0.3.0"
description = "DSH controlled embodied scene and dataset production"
requires-python = ">=3.11,<3.14"
dependencies = ["sqlalchemy>=2", "psycopg[binary]", "Pillow", "numpy", "trimesh>=4", "grpcio>=1.60", "protobuf>=4.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchforge_backend = ["native_assets.json", "native_materials.json", "material_previews/*.jpg"]
