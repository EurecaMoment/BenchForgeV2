[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge"
version = "0.2.0"
description = "Composable benchmark production tools for agent harnesses"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/EurecaMoment/BenchForgeV2"
Issues = "https://github.com/EurecaMoment/BenchForgeV2/issues"

[project.optional-dependencies]
dsh = ["PyYAML>=6"]
production = ["PyYAML>=6", "numpy>=1.24", "Pillow>=10", "SQLAlchemy>=2.0", "psycopg[binary]>=3.2", "trimesh>=4", "pycocotools>=2.0.10", "grpcio>=1.85.1", "protobuf>=7.35.1", "imageio-ffmpeg>=0.5"]
research = ["pypdf>=5"]
datasets = ["pyarrow>=15"]
training = ["torch>=2.4", "transformers>=4.49", "tokenizers>=0.21", "peft>=0.14", "Pillow>=10", "numpy>=1.24"]

[project.scripts]
benchforge = "server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["capabilities*", "pipelines*", "server*", "storage*", "service_access*", "ui*"]
namespaces = false

[tool.setuptools.package-data]
"capabilities.task_catalog" = ["resources/*.json"]
"capabilities.benchmark_design" = ["resources/*.json"]
"capabilities.scene_authoring" = ["resources/*.json", "resources/material_previews/*.jpg"]
"pipelines.scene_production" = ["recipes/*.json"]
"pipelines.benchmark" = ["recipes/*.json"]
"ui" = ["training_monitor/*.html", "training_monitor/*.js", "training_monitor/*.css"]
"capabilities.isaac_sim.grpc" = ["isaac_sim.proto"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work/**"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
