[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge"
version = "0.2.0"
description = "Composable benchmark production tools for agent harnesses"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/EurecaMoment/BenchForgeV2"
Issues = "https://github.com/EurecaMoment/BenchForgeV2/issues"

[project.optional-dependencies]
dsh = ["PyYAML>=6"]
production = ["PyYAML>=6", "numpy>=1.24", "Pillow>=10"]
research = ["pypdf>=5"]
datasets = ["pyarrow>=15"]
training = ["torch>=2.4", "transformers>=4.49", "tokenizers>=0.21", "peft>=0.14", "Pillow>=10", "numpy>=1.24"]

[project.scripts]
benchforge = "benchforge_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchforge_core*"]

[tool.setuptools.package-data]
benchforge_core = ["capabilities.json", "collectors/*.py", "knowledge/*.json", "vendor/**/*"]
"benchforge_core.spatial_learning" = ["graph.json", "templates.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
